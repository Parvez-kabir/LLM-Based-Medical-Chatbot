<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex AI - Law Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>⚖️ Lex AI</h1>
            <p>Law Chatbot - Ask me legal questions</p>
        </header>
        <div id="chat-box" class="chat-box">
            <div class="bot-message">Hello! Ask me any legal question. ⚖️</div>
        </div>
        <form id="chat-form">
            <input type="text" id="user_input" placeholder="Type your legal question..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
